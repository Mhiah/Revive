<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revive — onchain CTO for NEAR memecoins</title>
<meta name="description" content="Revive: onchain community takeover (CTO) for NEAR memecoins. Keeper heartbeat, hold-time-weighted takeover vote, Sputnik DAO steward.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090b; --panel: #0d1114; --line: #1c2428; --text: #d7e2e0; --dim: #6f7f7d;
    --alive: #39ff88; --dead: #ff4d5e; --vote: #ffb020; --dao: #8fb8ff;
    --mono: "JetBrains Mono", ui-monospace, monospace; --sans: "Space Grotesk", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .brand { font-family: var(--mono); font-weight: 800; letter-spacing: .2em; color: var(--text); text-decoration: none; }
  .brand span { color: var(--accent, var(--alive)); }
  nav { display: flex; gap: 4px; }
  nav a { font-family: var(--mono); font-size: 13px; color: var(--dim); text-decoration: none; padding: 8px 12px; border-radius: 6px; }
  nav a.on, nav a:hover { color: var(--text); background: var(--panel); }
  .net { font-family: var(--mono); font-size: 12px; color: var(--dim); margin-right: 10px; }
  button { font-family: var(--mono); font-size: 13px; font-weight: 600; background: transparent; color: var(--text);
    border: 1px solid var(--line); padding: 10px 14px; border-radius: 6px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent, var(--alive)); color: var(--accent, var(--alive)); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: var(--accent, var(--alive)); color: #041008; border-color: transparent; }
  button.primary:hover:not(:disabled) { filter: brightness(1.1); color: #041008; }
  input, select { font-family: var(--mono); font-size: 13px; background: #050708; color: var(--text); border: 1px solid var(--line);
    padding: 10px; border-radius: 6px; width: 100%; }
  label.f { display: grid; gap: 6px; font-size: 13px; }
  label.f span { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); padding: 16px; } }
  .full { grid-column: 1 / -1; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .label { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .hero h1 { font-size: 44px; line-height: 1.05; margin: 6px 0 10px; }
  .hero h1 em { font-style: normal; color: var(--alive); }
  .hero p { color: var(--dim); max-width: 640px; line-height: 1.55; margin: 0; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
  @media (max-width: 600px) { .stats { grid-template-columns: repeat(2, 1fr); } .hero h1 { font-size: 32px; } }
  .stat .v { font-family: var(--mono); font-size: 24px; font-weight: 700; margin-top: 4px; }
  .coins { display: grid; gap: 8px; margin-top: 14px; }
  .coinrow { display: grid; grid-template-columns: 14px 1.4fr 1fr 1fr .7fr; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--line);
    border-radius: 8px; text-decoration: none; color: var(--text); background: #0a0e10; }
  .coinrow:hover { border-color: var(--c); }
  @media (max-width: 700px) { .coinrow { grid-template-columns: 14px 1fr 1fr; } .coinrow .hide-sm { display: none; } }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .dot.beat { animation: beat 1s infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.5); } 30% { transform: scale(1); } }
  .coinrow b { font-size: 16px; }
  .coinrow small { font-family: var(--mono); color: var(--dim); margin-left: 6px; }
  .chip { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--c); }
  .mono { font-family: var(--mono); font-size: 13px; }
  .monitor { position: relative; overflow: hidden; }
  .monitor-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .coin { font-size: 26px; font-weight: 700; }
  .coin small { font-family: var(--mono); color: var(--dim); font-size: 14px; margin-left: 8px; }
  .status { font-family: var(--mono); font-weight: 800; font-size: 40px; letter-spacing: .08em; color: var(--accent); text-shadow: 0 0 22px var(--accent); }
  .status.blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  canvas { width: 100%; height: 170px; display: block; margin: 14px 0 6px; }
  .readouts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 600px) { .readouts { grid-template-columns: repeat(2, 1fr); } .status { font-size: 28px; } }
  .readout .v { font-family: var(--mono); font-size: 20px; font-weight: 600; margin-top: 4px; }
  .lives { color: var(--dead); letter-spacing: 2px; }
  .tabs { display: flex; gap: 6px; margin-top: 16px; border-bottom: 1px solid var(--line); }
  .tabs a { font-family: var(--mono); font-size: 13px; padding: 10px 14px; color: var(--dim); text-decoration: none; border-bottom: 2px solid transparent; }
  .tabs a.on { color: var(--text); border-color: var(--accent); }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .row:last-child { border-bottom: 0; }
  .row b { font-family: var(--mono); font-weight: 600; text-align: right; word-break: break-all; }
  .bar { height: 12px; background: #050708; border: 1px solid var(--line); border-radius: 6px; position: relative; overflow: hidden; margin: 8px 0 4px; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 0; }
  .bar .q { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .stack { display: grid; gap: 10px; margin-top: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  .lore { list-style: none; margin: 0; padding: 0; }
  .lore li { padding: 10px 0 10px 16px; border-left: 2px solid var(--line); position: relative; font-size: 14px; }
  .lore li::before { content: ""; position: absolute; left: -6px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--dim)); }
  .lore .k { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--c, var(--dim)); }
  .lore .t { font-family: var(--mono); font-size: 11px; color: var(--dim); float: right; }
  .check { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .check:last-child { border-bottom: 0; }
  .check .i { font-family: var(--mono); font-weight: 800; font-size: 16px; }
  .check .d { color: var(--dim); font-size: 13px; margin-top: 4px; line-height: 1.5; word-break: break-all; }
  .director { border-style: dashed; }
  .steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-top: 12px; }
  .steps button { text-align: left; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111a18; border: 1px solid var(--accent);
    color: var(--text); font-family: var(--mono); font-size: 13px; padding: 12px 16px; border-radius: 8px; max-width: 90vw; z-index: 20;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--dead); }
  .flash { position: absolute; inset: 0; background: var(--alive); opacity: 0; pointer-events: none; }
  .flash.go { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }
  .hint { color: var(--dim); font-size: 13px; line-height: 1.55; }
  .steps-how { counter-reset: s; display: grid; gap: 14px; margin-top: 12px; }
  .steps-how div { counter-increment: s; padding-left: 44px; position: relative; line-height: 1.55; }
  .steps-how div::before { content: counter(s); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--alive); color: var(--alive); font-family: var(--mono); display: grid; place-items: center; font-size: 13px; }
  a { color: var(--dao); }
  .empty { padding: 30px; text-align: center; color: var(--dim); border: 1px dashed var(--line); border-radius: 8px; }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/">RE<span>VIVE</span></a>
  <nav>
    <a href="#/" data-nav="watch">Flatline Watch</a>
    <a href="#/launch" data-nav="launch">Launch</a>
    <a href="#/how" data-nav="how">How it works</a>
  </nav>
  <div><span class="net" id="net"></span><button id="connect">Connect wallet</button></div>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script type="module">
// ================================================================= config
const params = new URLSearchParams(location.search);
const NETWORK = params.get("network") || "testnet";
// Set after the testnet deploy (scripts/demo-coins.mjs prints it); ?factory= overrides.
const DEFAULT_FACTORY = "revive-ztw7t.revive.testnet";
const FACTORY_ID = params.get("factory") || DEFAULT_FACTORY;
const LEGACY_COIN = params.get("contract");                 // old single-coin links
const DEMO = params.has("demo") || (!FACTORY_ID && !LEGACY_COIN);
const RPCS = NETWORK === "mainnet"
  ? ["https://free.rpc.fastnear.com", "https://near.drpc.org"]
  : ["https://test.rpc.fastnear.com", "https://near-testnet.drpc.org"];
const EXPLORER = NETWORK === "mainnet" ? "https://nearblocks.io" : "https://testnet.nearblocks.io";
const REPO = "https://github.com/Mhiah/Revive";
const TGAS30 = "30000000000000", TGAS300 = "300000000000000";
const YOCTO_NEAR = 10n ** 24n, YOCTO_TOKEN = 10n ** 18n, DAY = 86400;
const $ = (id) => document.getElementById(id);

// ================================================================ format
function fmtTokens(y) {
  const n = Number(BigInt(y) / YOCTO_TOKEN);
  if (n >= 1e9) return (n / 1e9).toFixed(2).replace(/\.00$/, "") + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}
function fmtNear(y) {
  const b = BigInt(y), whole = b / YOCTO_NEAR, frac = (b % YOCTO_NEAR) * 100n / YOCTO_NEAR;
  return `${whole}.${String(frac).padStart(2, "0")} Ⓝ`;
}
function fmtDur(s) {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / DAY), h = Math.floor(s % DAY / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${String(m).padStart(2, "0")}m`;
  return `${m}m ${String(sec).padStart(2, "0")}s`;
}
function fmtWeight(w) {          // micro-tokens x seconds, shown as token-days
  const td = Number(BigInt(w) / 1_000_000n) / DAY;
  if (td >= 1e9) return (td / 1e9).toFixed(2) + "B token-days";
  if (td >= 1e6) return (td / 1e6).toFixed(1) + "M token-days";
  if (td >= 1e3) return (td / 1e3).toFixed(1) + "K token-days";
  return td.toFixed(1) + " token-days";
}
const short = (a) => a && a.length > 30 ? a.slice(0, 13) + "…" + a.slice(-13) : a;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg, err = false) {
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.className = "toast", 3400);
}
const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function b58ToHex(s) {
  let n = 0n; for (const c of s) n = n * 58n + BigInt(B58.indexOf(c));
  let hex = n.toString(16); if (hex.length % 2) hex = "0" + hex;
  for (const c of s) { if (c === "1") hex = "00" + hex; else break; }
  return hex.padStart(64, "0");
}

// ============================================================ live (RPC)
async function rpc(params) {
  let lastErr;
  for (const url of RPCS) {
    try {
      const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: "revive", method: "query", params: { finality: "optimistic", ...params } }) });
      const j = await r.json();
      if (j.error) throw new Error(j.error.data || j.error.cause?.name || j.error.message);
      if (j.result?.error) throw new Error(j.result.error);
      return j.result;
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}
async function view(account_id, method_name, args = {}) {
  const r = await rpc({ request_type: "call_function", account_id, method_name, args_base64: btoa(JSON.stringify(args)) });
  return JSON.parse(new TextDecoder().decode(new Uint8Array(r.result)));
}
const viewAccount = (account_id) => rpc({ request_type: "view_account", account_id });
const viewKeys = (account_id) => rpc({ request_type: "view_access_key_list", account_id }).then((r) => r.keys || []);

let connector = null, account = null;
async function setupWallet() {
  const { NearConnector } = await import("https://esm.sh/@hot-labs/near-connect@0.12.0");
  connector = new NearConnector({ network: NETWORK });
  connector.on("wallet:signIn", (t) => { account = t.accounts[0].accountId; render(); });
  connector.on("wallet:signOut", () => { account = null; render(); });
  try { const w = await connector.wallet(); const accs = await w.getAccounts(); account = accs[0]?.accountId || null; } catch {}
}
async function sendTx(receiverId, methodName, args, deposit = "0", gas = TGAS30) {
  if (!account) { await connector.connect(); throw new Error("connect a wallet first"); }
  const w = await connector.wallet();
  return w.signAndSendTransaction({ receiverId, actions: [{ type: "FunctionCall", params: { methodName, args, gas, deposit } }] });
}

const liveRegistry = {
  async coins() {
    if (LEGACY_COIN && !FACTORY_ID) return [{ account_id: LEGACY_COIN }];
    const n = await view(FACTORY_ID, "get_coin_count");
    const out = [];
    for (let i = 0; i < n; i += 100) out.push(...await view(FACTORY_ID, "get_coins", { from_index: i, limit: 100 }));
    return out;
  },
  async launch(name, config, deposit) { return sendTx(FACTORY_ID, "launch", { name, config }, deposit, TGAS300); },
  coin: (id) => liveCoin(id),
};
function liveCoin(id) {
  return {
    id,
    status: () => view(id, "get_status"),
    lore: async () => { const n = await view(id, "get_lore_count"); return view(id, "get_lore", { from_index: Math.max(0, n - 100), limit: 100 }); },
    weight: (a) => view(id, "get_vote_weight", { account_id: a }),
    ballot: (a) => view(id, "get_ballot", { account_id: a }),
    me: () => account,
    call: (method, args = {}, deposit = "0") => sendTx(id, method, args, deposit),
    async verify() {
      const parent = id.split(".").slice(1).join(".");
      const [acc, keys, meta, supply, factoryHash, factoryKeys] = await Promise.all([
        viewAccount(id), viewKeys(id), view(id, "ft_metadata"), view(id, "ft_total_supply"),
        view(parent, "get_code_hash").catch(() => null), viewKeys(parent).catch(() => null)]);
      return { code_hash: acc.code_hash, balance: acc.amount, keys: keys.length, meta, supply, factory: parent, factory_code_hash: factoryHash, factory_keys: factoryKeys?.length ?? null };
    },
  };
}

// =========================================================== demo (mock)
// A simulated contract with the same rules, so the story can be shown with no wallet.
const CLOCK = { t: 1_800_000_000 };
const T = (n) => BigInt(Math.round(n)) * YOCTO_TOKEN;
const FAKE_HASH = "4mR8cMQh2B1Qb3uH9Yz1fWJxQ6bEvKXwXpN5d9a7TtqS";
class Mock {
  constructor(o) { this.o = o; this.reset(); }
  get t() { return CLOCK.t; }
  reset() {
    const o = this.o, t = this.t;
    this.id = o.id; this.keeper = "dev.testnet"; this.creator = "dev.testnet";
    this.cfg = { name: o.name, symbol: o.symbol, pulse_interval_secs: o.interval || 3 * DAY, vote_duration_secs: DAY, quorum_bps: 2000,
      comeback_penalty: (2n * YOCTO_NEAR).toString(), dao_suffix: ".sputnikv2.testnet", spend_cap: YOCTO_NEAR.toString() };
    this.born = t - (o.age || 0); this.lastPulse = t - (o.sincePulse || 0); this.lives = 0; this.treasury = 5n * YOCTO_NEAR; this.count = 0;
    this.supply = T(1e9); this.devLocked = T(1e8); this.devBurned = 0n; this.devActive = true;
    const s = this.born;
    this.holders = { "dev.testnet": { bal: T(3e8), since: s }, "alice.testnet": { bal: T(3e8), since: s },
      "bob.testnet": { bal: T(2e8), since: s }, "carol.testnet": { bal: T(1e8), since: s }, "whale.testnet": { bal: 0n, since: s } };
    this.takeover = null; this.ballots = {}; this.loreList = [];
    this.log("born", "dev.testnet", `${o.symbol} launched by dev.testnet`, this.born);
    (o.setup || (() => {}))(this);
  }
  log(kind, actor, note, at = this.t) { this.loreList.push({ at, kind, actor, note }); }
  flatlineAt() { return this.lastPulse + this.cfg.pulse_interval_secs; }
  st() { if (this.takeover) return this.t >= this.takeover.ends_at ? "vote_closed" : "voting"; return this.t > this.flatlineAt() ? "flatlined" : "alive"; }
  w(a, f) { const h = this.holders[a]; return h && h.since < f ? h.bal / 10n ** 12n * BigInt(f - h.since) : 0n; }
  eligible(f) { return Object.keys(this.holders).filter((a) => a !== this.keeper && a !== this.creator).reduce((s, a) => s + this.w(a, f), 0n); }
  fail(m) { throw new Error(m); }
  buy(a, tokens) {
    const amt = T(tokens), src = this.holders["dev.testnet"], h = this.holders[a];
    src.bal -= amt; const nb = h.bal + amt; h.since = Number((h.bal * BigInt(h.since) + amt * BigInt(this.t) + nb - 1n) / nb); h.bal = nb;
  }
  pulse(by, deposit = 0n) {
    if (by !== this.keeper) this.fail("only the keeper has a pulse");
    if (this.t > this.flatlineAt()) {
      if (this.takeover && this.t >= this.takeover.ends_at) this.fail("the vote has closed; call finalize_takeover first");
      if (deposit < BigInt(this.cfg.comeback_penalty)) this.fail("late pulse: attach the comeback penalty");
      const c = this.takeover; this.takeover = null;
      this.log("comeback", by, `came back ${fmtDur(this.t - this.flatlineAt())} late and paid ${fmtNear(deposit)}` + (c ? `; takeover #${c.id} cancelled` : ""));
    }
    this.treasury += deposit; this.lastPulse = this.t;
  }
  startTakeover(by, steward) {
    if (this.takeover) this.fail("a takeover vote is already open");
    if (this.t <= this.flatlineAt()) this.fail("the coin still has a pulse");
    if (by === this.keeper || by === this.creator) this.fail("the keeper and creator cannot start a takeover");
    const f = this.flatlineAt();
    if (this.w(by, f) === 0n) this.fail("only holders from before the flatline can start a takeover");
    if (!steward.endsWith(this.cfg.dao_suffix)) this.fail("the steward must be a Sputnik DAO");
    if (steward === this.keeper) this.fail("the steward must be a new account");
    this.count++;
    this.takeover = { id: this.count, steward, proposer: by, started_at: this.t, ends_at: this.t + this.cfg.vote_duration_secs,
      flatline_at: f, yes: "0", no: "0", total_eligible: this.eligible(f).toString(), voters: 0 };
    this.log("flatline", this.keeper, `no pulse since ${new Date(this.lastPulse * 1000).toUTCString().slice(5, 22)}`);
    this.log("takeover", by, `takeover #${this.count} opened: ${steward} nominated as keeper`);
  }
  vote(by, support) {
    const tk = this.takeover; if (!tk) this.fail("no takeover vote is open");
    if (this.t >= tk.ends_at) this.fail("the vote has closed");
    if (by === this.keeper || by === this.creator) this.fail("the keeper and creator cannot vote");
    if (this.ballots[tk.id + by]) this.fail("already voted");
    const wt = this.w(by, tk.flatline_at); if (wt === 0n) this.fail("no voting weight: only tokens held before the flatline count");
    tk[support ? "yes" : "no"] = (BigInt(tk[support ? "yes" : "no"]) + wt).toString(); tk.voters++;
    this.ballots[tk.id + by] = { support, weight: wt.toString() };
  }
  finalize() {
    const tk = this.takeover; if (!tk) this.fail("no takeover vote is open");
    if (this.t < tk.ends_at) this.fail("the vote is still open");
    this.takeover = null;
    const yes = BigInt(tk.yes), no = BigInt(tk.no), q = yes * 10000n >= BigInt(tk.total_eligible) * BigInt(this.cfg.quorum_bps);
    if (!(yes > no && q)) { this.log("takeover_failed", "anyone", `takeover #${tk.id} failed: ${yes <= no ? "holders voted no" : "quorum not reached"}`); return false; }
    const old = this.keeper; this.keeper = tk.steward; let burned = 0n;
    if (this.devActive) { burned = this.devLocked; this.devBurned = burned; this.supply -= burned; this.devLocked = 0n; this.devActive = false; }
    this.lastPulse = this.t; this.lives++;
    this.log("revived", tk.steward, `life #${this.lives}: keeper ${old} replaced by ${tk.steward}; ${fmtTokens(burned)} creator tokens burned`);
    return true;
  }
  // source interface
  async status() {
    const circ = Object.values(this.holders).reduce((s, h) => s + h.bal, 0n);
    return { status: this.st(), now: this.t, keeper: this.keeper, creator: this.creator, lives: this.lives, last_pulse: this.lastPulse,
      flatline_at: this.flatlineAt(), total_supply: this.supply.toString(), circulating: circ.toString(), treasury: this.treasury.toString(),
      dev_locked: this.devLocked.toString(), dev_burned: this.devBurned.toString(), takeover: this.takeover && { ...this.takeover },
      takeover_count: this.count, config: this.cfg, links: REPO };
  }
  async lore() { return this.loreList.slice(-100); }
  async weight(a) { if (a === this.keeper || a === this.creator) return "0"; return this.w(a, this.takeover ? this.takeover.flatline_at : this.flatlineAt()).toString(); }
  async ballot(a) { return this.takeover ? this.ballots[this.takeover.id + a] || null : null; }
  me() { return ACTOR.value; }
  async call(method, args = {}, deposit = "0") {
    const by = this.me();
    if (method === "pulse") return this.pulse(by, BigInt(deposit));
    if (method === "start_takeover") return this.startTakeover(by, args.steward);
    if (method === "vote") return this.vote(by, args.support);
    if (method === "finalize_takeover") { const ok = this.finalize(); if (ok) revivedFx(); return ok; }
    this.fail("not in the demo: " + method);
  }
  async verify() {
    const circ = Object.values(this.holders).reduce((s, h) => s + h.bal, 0n);
    return { code_hash: FAKE_HASH, balance: (this.treasury + 15n * YOCTO_NEAR / 10n).toString(), keys: 0, supply: this.supply.toString(),
      meta: { spec: "ft-1.0.0", decimals: 18 }, factory: "revive.testnet", factory_code_hash: FAKE_HASH, factory_keys: 0, circ };
  }
}

    ${item(v.keys === 0, v.keys === 0 ? "The coin has no access keys" : `The coin has ${v.keys} access key(s)`,
      "Nobody can sign transactions as this coin or replace its code. Only its rules can move its tokens and treasury.")}
    ${item(matches, matches ? "Same code as every Revive coin" : "Code hash does not match the factory",
      `Coin code hash <b>${esc(v.code_hash)}</b><br>Factory code hash <b>${esc(v.factory_code_hash || "—")}</b><br>SHA-256 hex ${esc(b58ToHex(v.code_hash))} — compare with the hash printed by <a href="${REPO}/actions" target="_blank" rel="noopener">CI</a>.`)}
    ${item(v.factory_keys === 0 ? true : v.factory_keys === null ? null : false, v.factory_keys === 0 ? "The factory is locked" : "The factory still has keys",
      `${esc(v.factory)} ${v.factory_keys === 0 ? "has no keys, so nobody can change how coins are made." : `has ${v.factory_keys ?? "?"} key(s).`}`)}
    ${item(solvent, solvent ? "The treasury is fully backed" : "Treasury exceeds the coin's balance",
      `Account balance ${fmtNear(v.balance)} ≥ treasury ${fmtNear(S.treasury)}.`)}
    ${item(supplyOk, supplyOk ? "Supply adds up" : "Supply does not add up",
      `Total ${fmtTokens(v.supply)} = held by holders ${fmtTokens(S.circulating ?? 0)} + creator locked ${fmtTokens(S.dev_locked)} (burned so far: ${fmtTokens(S.dev_burned)}).`)}
    ${keeperDao && isSputnik(S.keeper)
      ? item(true, "The keeper is a Sputnik DAO", `${esc(S.keeper)} — holders revived this coin ${S.lives} time(s).`)
      : keeperDao
      ? item(null, "The keeper is the steward holders voted in", `${esc(S.keeper)} — holders revived this coin ${S.lives} time(s). This demo coin uses a stand-in steward account, not a Sputnik DAO (its suffix is ${esc(S.config.dao_suffix)}).`)
      : item(null, "The keeper is the creator", `If ${esc(S.keeper)} stops pulsing, holders can vote a DAO in.`)}
  </section>`;
}

function directorPanel(id) {
  if (!DEMO) return "";
  return `<section class="panel full director">
    <div class="label">Demo mode — simulated contract, same rules${id === MOCKS[0].id ? "" : ". The scripted story runs on $NINE"}</div>
    <p class="hint">You are acting as <select id="actor" style="width:auto;display:inline-block">${["alice.testnet", "bob.testnet", "carol.testnet", "whale.testnet", "dev.testnet", REG.coin(id).keeper]
      .filter((v, i, a) => a.indexOf(v) === i).map((a) => `<option ${a === ACTOR.value ? "selected" : ""}>${a}</option>`).join("")}</select>. Run the story in order, or play any actor yourself.</p>
    ${id === MOCKS[0].id ? `<div class="steps">${STORY.map(([l], i) => `<button data-i="${i}">${l}</button>`).join("")}</div>` : ""}
  </section>`;
}
const NINE = () => MOCKS[0];
const as = (a) => { ACTOR.value = a; };
const STORY = [
  ["1 · Dev pulses", () => { as("dev.testnet"); CLOCK.t += DAY; NINE().pulse("dev.testnet"); return "Dev pulsed. The coin is alive."; }],
  ["2 · Dev goes silent (+3 days)", () => { CLOCK.t += 3 * DAY + 60; return "No pulse. FLATLINE."; }],
  ["3 · Whale buys 250M after death", () => { NINE().buy("whale.testnet", 250_000_000); return "Whale bought 250M — after the flatline."; }],
  ["4 · Alice opens takeover", () => { as("alice.testnet"); NINE().startTakeover("alice.testnet", "ninelives.sputnikv2.testnet"); return "Takeover opened: ninelives DAO nominated."; }],
  ["5 · Alice votes yes", () => { as("alice.testnet"); NINE().vote("alice.testnet", true); return "Alice: YES."; }],
  ["6 · Whale tries to vote no", () => { as("whale.testnet"); NINE().vote("whale.testnet", false); }],
  ["7 · Bob votes yes", () => { as("bob.testnet"); NINE().vote("bob.testnet", true); return "Bob: YES."; }],
  ["8 · Carol votes no", () => { as("carol.testnet"); NINE().vote("carol.testnet", false); return "Carol: NO."; }],
  ["9 · Vote ends (+1 day)", () => { CLOCK.t += DAY; return "Vote closed."; }],
  ["10 · Finalize → REVIVE", () => { as("bob.testnet"); const ok = NINE().finalize(); if (ok) revivedFx(); return ok ? "REVIVED. Life #" + NINE().lives + ". Dev tokens burned." : "Takeover failed."; }],
  ["11 · DAO pulses as keeper", () => { as("ninelives.sputnikv2.testnet"); CLOCK.t += DAY; NINE().pulse("ninelives.sputnikv2.testnet"); return "The DAO keeps the heart beating."; }],
  ["Alt · Dev comes back mid-vote", () => { as("dev.testnet"); NINE().pulse("dev.testnet", 2n * YOCTO_NEAR); return "Comeback: 2 Ⓝ penalty to the treasury, vote cancelled."; }],
  ["↺ Reset", () => { NINE().reset(); as("alice.testnet"); return "Reset."; }],
];

// ================================================================ actions
function bind(r) {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  if (r.page === "coin") {
    const src = REG.coin(r.id), S = window.__S;
    const act = async (method, args, deposit, ok) => {
      try { await src.call(method, args, deposit); toast(ok); }
      catch (e) { toast(String(e.message || e).replace(/^.*Smart contract panicked: /, ""), true); }
      await render();
    };
    on("b-pulse", () => { const late = $("b-pulse").dataset.late; act("pulse", {}, late ? S.config.comeback_penalty : "0", late ? "Back from the dead. Penalty paid to the treasury." : "Pulse sent. Still alive."); });
    on("b-start", () => act("start_takeover", { steward: $("steward").value.trim() }, "0", "Takeover opened. Holders, vote."));
    on("b-yes", () => act("vote", { support: true }, "0", "Voted YES."));
    on("b-no", () => act("vote", { support: false }, "0", "Voted NO."));
    on("b-final", () => act("finalize_takeover", {}, "0", "Vote finalized."));
    const actor = $("actor"); if (actor) actor.onchange = () => { ACTOR.value = actor.value; render(); };
    const steps = document.querySelector(".steps");
    if (steps) steps.onclick = async (e) => {
      const b = e.target.closest("button"); if (!b) return;
      try { const msg = STORY[b.dataset.i][1](); if (msg) toast(msg); } catch (err) { toast("Rejected: " + err.message, true); }
      await render();
    };
    if ($("ecg")) startEcg();
  }
  if (r.page === "launch") {
    const form = $("launch");
    const cost = () => { try { const { deposit } = readLaunch(form); $("cost").textContent = `You'll attach ${fmtNear(deposit)} (${fmtNear(LAUNCH_COST)} storage + treasury seed).`; } catch {} };
    form.oninput = cost; cost();
    form.onsubmit = async (e) => {
      e.preventDefault();
      const { name, config, deposit } = readLaunch(form);
      try {
        const id = await REG.launch(name, config, deposit);
        toast(`${config.symbol} launched.`);
        location.hash = `#/coin/${encodeURIComponent(typeof id === "string" ? id : `${name}.${FACTORY_ID}`)}`;
      } catch (err) { toast(String(err.message || err), true); }
    };
  }
}

function revivedFx() { const f = $("flash"); if (f) { f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); } ecg.kick = 1; }

// ==================================================================== ECG
const ecg = { x: 0, kick: 0, last: [], running: false };
function startEcg() { if (!ecg.running) { ecg.running = true; requestAnimationFrame(drawEcg); } }
function drawEcg() {
  const c = $("ecg");
  if (!c) { ecg.running = false; return; }
  const dpr = devicePixelRatio || 1;
  if (c.width !== c.clientWidth * dpr) { c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr; ecg.last = []; ecg.x = 0; }
  const g = c.getContext("2d"), W = c.width, H = c.height, mid = H * 0.6;
  const status = window.__S ? window.__S.status : "alive";
  const color = getComputedStyle(document.documentElement).getPropertyValue(COLORS[status] || "--alive").trim();
  for (let i = 0; i < 2; i++) {
    ecg.x = (ecg.x + 2.2 * dpr) % W;
    const p = (performance.now() / 900) % 1;
    let y = mid + (Math.random() - 0.5) * 1.5 * dpr;
    if (ecg.kick > 0) { y = mid - Math.sin(ecg.kick * Math.PI) * H * 0.55; ecg.kick = Math.max(0, ecg.kick - 0.02); }
    else if (status === "alive") {
      if (p > .10 && p < .14) y -= H * .06 * Math.sin((p - .10) / .04 * Math.PI);
      if (p > .20 && p < .22) y += H * .08;
      if (p > .22 && p < .25) y -= H * .45 * Math.sin((p - .22) / .03 * Math.PI);
      if (p > .25 && p < .27) y += H * .12;
      if (p > .40 && p < .48) y -= H * .09 * Math.sin((p - .40) / .08 * Math.PI);
    } else if (status === "voting") {
      if (p > .5 && p < .53) y -= H * .05 * Math.sin((p - .5) / .03 * Math.PI);
    }
    ecg.last[Math.floor(ecg.x / dpr)] = y;
  }
  g.clearRect(0, 0, W, H);
  g.strokeStyle = "rgba(255,255,255,.04)"; g.lineWidth = 1;
  for (let gx = 0; gx < W; gx += 24 * dpr) { g.beginPath(); g.moveTo(gx, 0); g.lineTo(gx, H); g.stroke(); }
  for (let gy = 0; gy < H; gy += 24 * dpr) { g.beginPath(); g.moveTo(0, gy); g.lineTo(W, gy); g.stroke(); }
  g.strokeStyle = color; g.lineWidth = 2.2 * dpr; g.shadowColor = color; g.shadowBlur = 12 * dpr;
  g.beginPath();
  const head = Math.floor(ecg.x / dpr), cols = Math.floor(W / dpr);
  for (let i = 0; i < cols; i++) {
    if (i > head && i - head < 14) continue;
    const y = ecg.last[i] ?? mid;
    if (i === 0 || i === head + 14) g.moveTo(i * dpr, y); else g.lineTo(i * dpr, y);
  }
  g.stroke(); g.shadowBlur = 0;
  g.fillStyle = color; g.beginPath(); g.arc(ecg.x, ecg.last[head] ?? mid, 3.5 * dpr, 0, 7); g.fill();
  requestAnimationFrame(drawEcg);
}

// =================================================================== boot
window.addEventListener("hashchange", render);
if (!DEMO) {
  setupWallet().then(render).catch(() => {});
  $("connect").onclick = async () => {
    if (!connector) return;
    if (account) { const w = await connector.wallet(); await w.signOut(); account = null; render(); }
    else connector.connect();
  };
  setInterval(() => { if (!document.activeElement || !["INPUT", "SELECT"].includes(document.activeElement.tagName)) render(); }, 8000);
}
render();
</script>
</body>
