<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revive — onchain CTO for NEAR memecoins</title>
<meta name="description" content="Revive: onchain community takeover (CTO) for NEAR memecoins. Keeper heartbeat, hold-time-weighted takeover vote, Sputnik DAO steward.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Typography */
    --font-heading: "Space Grotesk", system-ui, sans-serif;
    --font-body: "DM Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    /* Brand */
    --color-black: #0B0F19; --color-white: #FFFFFF;
    --color-primary: #2563EB; --color-primary-hover: #1D4ED8;
    /* Market */
    --color-positive: #15803D; --color-negative: #B91C1C;
    /* Backgrounds */
    --color-background: #FFFFFF; --color-background-secondary: #F8FAFC; --color-surface: #FFFFFF;
    /* Text */
    --color-text-primary: #0B0F19; --color-text-secondary: #64748B; --color-text-muted: #334155;
    /* Borders */
    --color-border: #E2E8F0;
    /* Highlights */
    --color-blue-light: #EFF6FF; --color-green-light: #F0FDF4; --color-red-light: #FEF2F2;

    /* App aliases used by the scripts below */
    --bg: var(--color-background-secondary); --panel: var(--color-surface); --line: var(--color-border);
    --text: var(--color-text-primary); --dim: var(--color-text-secondary); --muted: var(--color-text-muted);
    --alive: var(--color-positive); --dead: var(--color-negative); --vote: #B45309; --dao: var(--color-primary);
    --mono: var(--font-mono); --sans: var(--font-body);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
  h1, h2, h3, h4, h5, h6, .coin, .brand { font-family: var(--font-heading); }
  .mono, .label, .readout .v, .stat .v, .row b, .shelf, .trend, .status, .lore .t, .lore .k, .coinrow small, .coin small, .chip, .tag, .check .i,
  table.t td, .legend, input[inputmode="decimal"] { font-variant-numeric: tabular-nums; }

  /* Header and navigation */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 24px;
    background: var(--color-white); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: -.02em; color: var(--text); text-decoration: none; }
  .brand span { color: var(--color-primary); }
  nav { display: flex; gap: 20px; }
  nav a { font-family: var(--font-body); font-size: 15px; font-weight: 500; color: var(--muted); text-decoration: none; padding: 8px 14px; border-radius: 8px; white-space: nowrap; }
  nav a:hover { color: var(--text); background: var(--color-background-secondary); }
  nav a.on { color: var(--color-primary-hover); background: var(--color-blue-light); }
  .me { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .guide { font-size: 13px; font-weight: 500; color: var(--dim); text-decoration: underline; text-underline-offset: 3px; }
  .guide:hover, .guide.on { color: var(--color-primary); }
  @media (max-width: 720px) { nav { gap: 4px; } nav a { padding: 8px 10px; font-size: 14px; } .me { align-items: flex-start; } }

  /* Buttons and forms */
  button { font-family: var(--font-body); font-size: 14px; font-weight: 600; background: var(--color-white); color: var(--text);
    border: 1px solid var(--line); padding: 10px 16px; border-radius: 8px; cursor: pointer; transition: background .15s, border-color .15s; }
  button:hover:not(:disabled) { background: var(--color-background-secondary); border-color: #CBD5E1; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--color-primary); color: var(--color-white); border-color: var(--color-primary); }
  button.primary:hover:not(:disabled) { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }
  button:focus-visible, input:focus, select:focus, a:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  input, select { font-family: var(--font-body); font-size: 15px; background: var(--color-white); color: var(--text); border: 1px solid var(--line);
    padding: 10px 12px; border-radius: 8px; width: 100%; }
  input::placeholder { color: #94A3B8; }
  label.f { display: grid; gap: 6px; font-size: 14px; }
  label.f span { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; color: var(--dim); }

  /* Layout and cards */
  main { padding: 24px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); padding: 16px; } }
  .full { grid-column: 1 / -1; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
  .ph { margin-bottom: 16px; }
  .ph h2 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.02em; line-height: 1.25; }
  .ph p { margin: 4px 0 0; color: var(--dim); font-size: 15px; line-height: 1.6; max-width: 760px; }
  .label { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; color: var(--dim); }

  /* Hero */
  .hero { grid-column: 1 / -1; padding: 36px 4px 18px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: 20px 72px; align-items: end; }
  .hero h1 { font-size: clamp(36px, 4.6vw, 64px); font-weight: 700; line-height: 1.08; letter-spacing: -.03em; margin: 12px 0 0; }
  .hero h1 em { font-style: normal; color: var(--color-primary); }
  .hero p { color: var(--muted); max-width: 600px; font-size: 17px; line-height: 1.65; margin: 0; }
  .hero-copy { padding-bottom: 8px; border-left: 2px solid var(--line); padding-left: 24px; }
  @media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); padding-top: 24px; }
    .hero-copy { border-left: 0; padding-left: 0; } }
  .hero .sim { font-size: 15px; margin-top: 14px; color: var(--dim); }

  /* Flatline Watch */
  .watchhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px 32px; flex-wrap: wrap; margin-bottom: 6px; }
  .watchhead .ph { margin: 0; }
  .stats { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--color-background-secondary); }
  .stat { padding: 10px 18px; border-left: 1px solid var(--line); min-width: 112px; }
  .stat:first-child { border-left: 0; }
  .stat .v { font-family: var(--font-mono); font-size: 22px; font-weight: 600; margin-top: 2px; }
  @media (max-width: 600px) { .stats { width: 100%; } .stat { flex: 1; min-width: 0; padding: 10px; } .stat .label { font-size: 9.5px; letter-spacing: 0; } }
  .coins { display: grid; gap: 0; margin-top: 14px; }
  .coinrow, .coinhead { display: grid; grid-template-columns: 14px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,.8fr); align-items: center; gap: 14px; padding: 16px; }
  .coinrow { border-bottom: 1px solid var(--line); text-decoration: none; color: var(--text); background: var(--color-white); transition: background .15s; }
  .coinrow:last-child { border-bottom: 0; }
  .coinrow:hover { background: var(--color-background-secondary); }
  .coinhead { padding-top: 0; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: .02em; text-transform: uppercase; color: var(--dim); }
  .shelf { display: grid; gap: 6px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
  .shelf .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; border: 0; margin: 0; }
  .shelf .bar i { position: static; display: block; height: 100%; border-radius: 2px; background: var(--c); }
  .trend { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--t); white-space: nowrap; }
  .trend b { font-size: 12px; margin-right: 6px; }
  @media (max-width: 700px) {
    .coinrow, .coinhead { grid-template-columns: 14px minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,.8fr); gap: 10px; padding-left: 8px; padding-right: 8px; }
    .hide-sm { display: none !important; }
    .coinrow .tag { display: table; margin: 4px 0 0; }
    .trend b { font-size: 15px; margin: 0; } }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 16%, transparent); }
  .dot.beat { animation: beat 1s infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.35); } 30% { transform: scale(1); } }
  .coinrow b { font-size: 16px; font-weight: 600; }
  .coinrow small { font-family: var(--font-mono); font-size: 13px; color: var(--dim); margin-left: 6px; }
  .chip { display: inline-block; font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--c);
    background: color-mix(in srgb, var(--c) 9%, white); border-radius: 6px; padding: 3px 8px; }
  .mono { font-family: var(--font-mono); font-size: 13px; }

  /* Coin page */
  .monitor { position: relative; overflow: hidden; }
  .monitor-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .coin { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; }
  .coin small { font-family: var(--font-mono); color: var(--dim); font-size: 14px; font-weight: 500; letter-spacing: 0; margin-left: 8px; }
  .status { font-family: var(--font-mono); font-weight: 600; font-size: 34px; letter-spacing: .02em; color: var(--accent); }
  .status.blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  canvas { width: 100%; height: 170px; display: block; margin: 14px 0 6px; border-radius: 10px; background: var(--color-background-secondary); }
  .readouts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 600px) { .readouts { grid-template-columns: repeat(2, 1fr); } .status { font-size: 26px; } }
  .readout .v { font-family: var(--font-mono); font-size: 20px; font-weight: 600; margin-top: 4px; }
  .lives { color: var(--text); letter-spacing: 2px; }
  .tabs { display: flex; gap: 6px; margin-top: 16px; border-bottom: 1px solid var(--line); }
  .tabs a { font-family: var(--font-body); font-size: 15px; font-weight: 500; padding: 10px 14px; color: var(--dim); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a:hover { color: var(--text); }
  .tabs a.on { color: var(--color-primary); border-color: var(--color-primary); }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--muted); }
  .row:last-child { border-bottom: 0; }
  .row b { font-family: var(--font-mono); font-weight: 500; color: var(--text); text-align: right; word-break: break-all; }
  .bar { height: 12px; background: var(--color-background-secondary); border: 1px solid var(--line); border-radius: 6px; position: relative; overflow: hidden; margin: 8px 0 4px; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 0; }
  .bar .q { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .stack { display: grid; gap: 10px; margin-top: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  .lore { list-style: none; margin: 0; padding: 0; }
  .lore li { padding: 10px 0 10px 18px; border-left: 2px solid var(--line); position: relative; font-size: 15px; }
  .lore li::before { content: ""; position: absolute; left: -6px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--dim)); }
  .lore .k { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--c, var(--dim)); }
  .lore .t { font-family: var(--font-mono); font-size: 12px; color: var(--dim); float: right; }
  .check { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .check:last-child { border-bottom: 0; }
  .check .i { font-family: var(--font-mono); font-weight: 600; font-size: 16px; }
  .check b { font-weight: 600; }
  .check .d { color: var(--dim); font-size: 14px; margin-top: 4px; line-height: 1.55; word-break: break-all; }
  .director { border-style: dashed; background: var(--color-background-secondary); }
  .steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-top: 12px; }
  .steps button { text-align: left; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--color-white); border: 1px solid var(--line);
    border-left: 4px solid var(--color-primary); color: var(--text); font-size: 14px; font-weight: 500; padding: 12px 16px; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, .12); max-width: 90vw; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.err { border-left-color: var(--dead); }
  .flash { position: absolute; inset: 0; background: var(--alive); opacity: 0; pointer-events: none; }
  .flash.go { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { opacity: .18; } 100% { opacity: 0; } }
  .hint { color: var(--dim); font-size: 14px; line-height: 1.6; }
  .steps-how { counter-reset: s; display: grid; gap: 14px; margin-top: 12px; }
  .steps-how div { counter-increment: s; padding-left: 44px; position: relative; line-height: 1.6; color: var(--muted); }
  .steps-how div b { color: var(--text); }
  .steps-how div::before { content: counter(s); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%;
    background: var(--color-blue-light); color: var(--color-primary-hover); font-family: var(--font-mono); font-weight: 600; display: grid; place-items: center; font-size: 13px; }
  a { color: var(--color-primary); }
  a:hover { color: var(--color-primary-hover); }
  .tag { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--color-primary-hover) !important;
    background: var(--color-blue-light); border-radius: 4px; padding: 2px 6px; margin-left: 8px; vertical-align: 2px; }
  .tokencard { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--color-background-secondary); }

  /* Activity chart */
  .chart { position: relative; margin-top: 10px; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .tip { position: absolute; pointer-events: none; background: var(--color-white); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, .12); padding: 8px 10px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; white-space: nowrap;
    opacity: 0; transition: opacity .1s; z-index: 2; }
  .chart .tip.on { opacity: 1; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-family: var(--font-body); font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { width: 14px; height: 14px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  table.t td, table.t th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  table.t td { font-family: var(--font-mono); }
  table.t th { color: var(--dim); font-weight: 500; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .02em; }
  details summary { cursor: pointer; font-size: 14px; font-weight: 500; color: var(--color-primary); margin-top: 10px; }
  .empty { padding: 30px; text-align: center; color: var(--dim); border: 1px dashed var(--line); border-radius: 10px; }
</style>
</head>

<header>
  <a class="brand" href="#/">RE<span>VIVE</span></a>
  <nav>
    <a href="#/" data-nav="watch">Flatline Watch</a>
    <a href="#/launch" data-nav="launch">Launch</a>
    <a href="#/connect" data-nav="connect">Connect a coin</a>
  </nav>
  <div class="me"><button id="connect">Connect wallet</button><a href="#/how" class="guide" data-nav="how">User guide</a></div>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script type="module">
// ================================================================= config
const params = new URLSearchParams(location.search);
const NETWORK = params.get("network") || "testnet";
// Set after the testnet deploy (scripts/demo-coins.mjs prints it); ?factory= overrides.
const DEFAULT_FACTORY = "revive-ztw7t.revive.testnet";
// The factory that can connect outside tokens (deploys guards). ?connect= overrides.
const DEFAULT_CONNECT = "revive-bhtat.revive.testnet";
const FACTORY_ID = params.get("factory") || DEFAULT_FACTORY;
const CONNECT_FACTORY = params.get("connect") || DEFAULT_CONNECT;
const FACTORIES = [...new Set([FACTORY_ID, CONNECT_FACTORY].filter(Boolean))];
const LEGACY_COIN = params.get("contract");                 // old single-coin links
const DEMO = params.has("demo") || (!FACTORY_ID && !LEGACY_COIN);
const RPCS = NETWORK === "mainnet"
  ? ["https://free.rpc.fastnear.com", "https://near.drpc.org"]
  : ["https://test.rpc.fastnear.com", "https://near-testnet.drpc.org"];
const EXPLORER = NETWORK === "mainnet" ? "https://nearblocks.io" : "https://testnet.nearblocks.io";
const REPO = "https://github.com/Mhiah/Revive";
const TGAS30 = "30000000000000", TGAS100 = "100000000000000", TGAS300 = "300000000000000";
const YOCTO_NEAR = 10n ** 24n, YOCTO_TOKEN = 10n ** 18n, DAY = 86400;
const $ = (id) => document.getElementById(id);
let DEC = 18;                     // decimals of the coin on screen (connected tokens vary)

// ================================================================ format
function fmtTokens(y, dec = DEC) {
  const n = Number(BigInt(y) / 10n ** BigInt(dec));
  if (n >= 1e9) return (n / 1e9).toFixed(2).replace(/\.00$/, "") + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}
function fmtNear(y) {
  const b = BigInt(y), whole = b / YOCTO_NEAR, frac = (b % YOCTO_NEAR) * 100n / YOCTO_NEAR;
  return `${whole}.${String(frac).padStart(2, "0")} Ⓝ`;
}
function fmtDur(s) {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / DAY), h = Math.floor(s % DAY / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${String(m).padStart(2, "0")}m`;
  return `${m}m ${String(sec).padStart(2, "0")}s`;
}
function fmtWeight(w) {          // micro-tokens x seconds, shown as token-days
  const td = Number(BigInt(w) / 1_000_000n) / DAY;
  if (td >= 1e9) return (td / 1e9).toFixed(2) + "B token-days";
  if (td >= 1e6) return (td / 1e6).toFixed(1) + "M token-days";
  if (td >= 1e3) return (td / 1e3).toFixed(1) + "K token-days";
  return td.toFixed(1) + " token-days";
}
function parseUnits(str, dec = DEC) {           // "12.5" -> raw integer string, no float rounding
  const s = String(str).trim();
  if (!/^\d+(\.\d+)?$/.test(s)) throw new Error("enter an amount like 1000 or 12.5");
  const [w, f = ""] = s.split(".");
  return (BigInt(w) * 10n ** BigInt(dec) + BigInt((f + "0".repeat(dec)).slice(0, dec) || "0")).toString();
}
function formatUnits(raw, dec = DEC) {
  const b = BigInt(raw), d = 10n ** BigInt(dec), f = (b % d).toString().padStart(dec, "0").replace(/0+$/, "");
  return (b / d).toString() + (f ? "." + f : "");
}
const ph = (title, sub = "") => `<div class="ph"><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ""}</div>`;
const short = (a) => a && a.length > 30 ? a.slice(0, 13) + "…" + a.slice(-13) : a;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg, err = false) {
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.className = "toast", 3400);
}
const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function b58ToHex(s) {
  let n = 0n; for (const c of s) n = n * 58n + BigInt(B58.indexOf(c));
  let hex = n.toString(16); if (hex.length % 2) hex = "0" + hex;
  for (const c of s) { if (c === "1") hex = "00" + hex; else break; }
  return hex.padStart(64, "0");
}

// ============================================================ live (RPC)
async function rpc(params) {
  let lastErr;
  for (const url of RPCS) {
    try {
      const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: "revive", method: "query", params: { finality: "optimistic", ...params } }) });
      const j = await r.json();
      if (j.error) throw new Error(j.error.data || j.error.cause?.name || j.error.message);

async function view(account_id, method_name, args = {}) {

// RPC nodes don't keep transaction history, so the Activity chart reads it from FastNEAR's
// public transactions API (no key, CORS open). Each coin's history is reused for 2 minutes.
const FTX = NETWORK === "mainnet" ? "https://tx.main.fastnear.com/v0" : "https://tx.test.fastnear.com/v0";
const ACT = new Map();
async function fpost(path, body) {
  const r = await fetch(FTX + path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("FastNEAR " + r.status);
  return r.json();
}
const nsToS = (ns) => Math.floor(Number(ns) / 1e9);
async function txHistory(account, max = 200) {
  const a = await fpost("/account", { account_id: account });
  const list = (a.account_txs || []).slice(0, max), ok = new Map(list.map((t) => [t.transaction_hash, t]));
  const chunks = [];
  for (let i = 0; i < list.length; i += 20) chunks.push(list.slice(i, i + 20).map((t) => t.transaction_hash));
  const txs = (await Promise.all(chunks.map((h) => fpost("/transactions", { tx_hashes: h })))).flatMap((j) => j.transactions || []);
  return { txs, ok, partial: (a.txs_count ?? list.length) > list.length };
}
// NEP-141 events the token itself logged: one entry per transfer or mint.
function ftEvents(txs, token) {
  const out = [];
  for (const tx of txs) for (const r of tx.receipts || []) {
    const eo = r.execution_outcome;
    if (!eo || eo.outcome.executor_id !== token || eo.outcome.status?.Failure) continue;
    for (const log of eo.outcome.logs || []) {
      if (!log.startsWith("EVENT_JSON:")) continue;
      let e; try { e = JSON.parse(log.slice(11)); } catch { continue; }
      if (e.standard !== "nep141" || !["ft_transfer", "ft_mint"].includes(e.event)) continue;
      for (const d of e.data || []) out.push({ t: nsToS(eo.block_timestamp), amount: d.amount, to: d.new_owner_id || d.owner_id, from: d.old_owner_id || null });
    }
  }
  return out;
}
async function liveActivity(id, S, lore) {
  const token = S.kind === "guard" ? S.token_id : id;
  const hit = ACT.get(id);
  if (hit && Date.now() - hit.at < 120_000) return withLore(hit.d, S, lore);
  let d;
  try {
    const [own, tok] = await Promise.all([txHistory(id), token === id ? null : txHistory(token)]);
    const calls = own.txs.filter((tx) => tx.transaction.receiver_id === id && own.ok.get(tx.transaction.hash)?.is_success)
      .flatMap((tx) => tx.transaction.actions.map((a) => ({ t: nsToS(own.ok.get(tx.transaction.hash).tx_block_timestamp),
        kind: a.FunctionCall?.method_name, by: tx.transaction.signer_id })))
      .filter((e) => e.kind === "pulse" || e.kind === "vote");
    const transfers = ftEvents((tok || own).txs, token);
    const partial = own.partial || !!tok?.partial;
    const times = [...calls, ...transfers].map((x) => x.t);
    d = { calls, transfers, partial, from: partial && times.length ? Math.min(...times) : null, source: "FastNEAR" };
  } catch (e) {
    if (hit) return withLore(hit.d, S, lore);               // keep the last good copy
    d = { calls: [], transfers: null, partial: true, from: null, source: "lore", error: e.message };
  }
  ACT.set(id, { at: Date.now() - (d.error ? 90_000 : 0), d });   // a failed fetch is retried after 30s
  return withLore(d, S, lore);
}
// Lore is on-chain and complete: it supplies births, comebacks, takeovers and revivals.
function withLore(d, S, lore) {
  const LK = { born: 1, lock: 1, comeback: 1, takeover: 1, revived: 1, takeover_failed: 1 };
  const fromLore = lore.filter((l) => LK[l.kind]).map((l) => ({ t: l.at, kind: l.kind, by: l.actor }));
  const comebacks = fromLore.filter((e) => e.kind === "comeback").map((e) => e.t);
  const calls = d.calls.filter((e) => !(e.kind === "pulse" && comebacks.some((c) => Math.abs(c - e.t) < 5)));
  const events = [...calls, ...fromLore];
  if (!d.calls.length && S.last_pulse && !events.some((e) => e.t === S.last_pulse)) events.push({ t: S.last_pulse, kind: "pulse", by: S.keeper });
  return { ...d, events: events.sort((a, b) => a.t - b.t) };
}

function liveCoin(id) {
  let last = null;
  return {
    id,
    status: async () => (last = await view(id, "get_status")),
    lore: async () => { const n = await view(id, "get_lore_count"); return view(id, "get_lore", { from_index: Math.max(0, n - 100), limit: 100 }); },
    weight: (a) => view(id, "get_vote_weight", { account_id: a }),
    ballot: (a) => view(id, "get_ballot", { account_id: a }),
    stakeOf: (a) => view(id, "get_stake", { account_id: a }),
    wallet: (a) => view(last.token_id, "ft_balance_of", { account_id: a }),
    me: () => account,
    call: (method, args = {}, deposit = "0", gas = TGAS30) => sendTx(id, method, args, deposit, gas),
    // Stake and lock go through the token: ft_transfer_call to the guard with a msg.
    send: (amount, msg) => sendTx(last.token_id, "ft_transfer_call", { receiver_id: id, amount, msg }, "1", TGAS100),
    async activity(S) { return liveActivity(id, S, await this.lore()); },
    async verify(S) {
      const parent = id.split(".").slice(1).join(".");
      const guard = S.kind === "guard";
      const token = guard ? S.token_id : id;
      const [acc, keys, meta, supply, factoryHash, factoryKeys, held] = await Promise.all([
        viewAccount(id), viewKeys(id), view(token, "ft_metadata"), view(token, "ft_total_supply"),
        view(parent, guard ? "get_guard_code_hash" : "get_code_hash").catch(() => null), viewKeys(parent).catch(() => null),
        guard ? view(token, "ft_balance_of", { account_id: id }) : Promise.resolve(null)]);
      return { code_hash: acc.code_hash, balance: acc.amount, keys: keys.length, meta, supply, factory: parent, factory_code_hash: factoryHash,
        factory_keys: factoryKeys?.length ?? null, held };
    },
  };
}

const CLOCK = { t: 1_800_000_000 };
const T = (n) => BigInt(Math.round(n)) * YOCTO_TOKEN;

  // comeback or revival, where the keeper went quiet long enough to flatline.
  synthHistory() {

    const gaps = this.loreList.filter((l) => l.kind === "comeback" || l.kind === "revived").map((l) => [l.at - iv * 1.4, l.at]);
    for (let t = this.born + iv * (0.3 + rnd() * 0.3); t < this.lastPulse - 60; t += iv * (0.45 + rnd() * 0.4)) {
      if (!gaps.some(([a, b]) => t > a && t < b)) this.calls.push({ t: Math.round(t), kind: "pulse", by: "dev.testnet" });
    }
    this.calls.push({ t: this.lastPulse, kind: "pulse", by: this.keeper });
  }
  async activity(S) {

    const transfers = [];
    for (let t = this.born, i = 0; t < this.t; t += step, i++) {
      const age = (t - this.born) / DAY, deadNow = t > this.flatlineAt();
      const rate = (4 * Math.exp(-age / 6) + 0.6) * (deadNow ? 0.35 : 1) * step / 3600 / 2;
      const n = Math.floor(rnd() * rate * 2 + (rnd() < rate % 1 ? 1 : 0));
      for (let k = 0; k < n; k++) transfers.push({ t: t + Math.floor(rnd() * step), amount: T(Math.round(1e5 + rnd() ** 3 * 3e7)).toString() });
    }

  }

      if (deposit < BigInt(this.cfg.comeback_penalty)) this.fail("late pulse: attach the comeback penalty");
      const c = this.takeover; this.takeover = null;

  }

    if (by === this.keeper || by === this.creator) this.fail("the keeper and creator cannot start a takeover");
    const f = this.flatlineAt();
    if (this.w(by, f) === 0n) this.fail("only holders from before the flatline can start a takeover");
    if (!steward.endsWith(this.cfg.dao_suffix)) this.fail("the steward must be a Sputnik DAO");
    if (steward === this.keeper) this.fail("the steward must be a new account");
    this.count++;

    this.log("flatline", this.keeper, `no pulse since ${new Date(this.lastPulse * 1000).toUTCString().slice(5, 22)}`);

  }

function seeded(str) {                       // small deterministic RNG (mulberry32)
  let a = [...str].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 2654435761) >>> 0, 1779033703);
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// ----------------------------------------------------------- Flatline Watch
async function watchView() {
  setAccent("alive");
  const coins = await REG.coins();
  const rows = await Promise.all(coins.map(async (c) => {
    try { return { c, s: await REG.coin(c.account_id).status() }; } catch { return { c, s: null }; }
  }));
  const rank = { voting: 0, vote_closed: 0, flatlined: 1, alive: 2 };
  rows.sort((x, y) => !x.s ? 1 : !y.s ? -1 : (rank[x.s.status] - rank[y.s.status]) ||
    ((x.s.flatline_at - x.s.now) - (y.s.flatline_at - y.s.now)));
  const live = rows.filter((r) => r.s);
  const dead = live.filter((r) => r.s.status === "flatlined").length;
  const votes = live.filter((r) => r.s.takeover).length;
  const lives = live.reduce((n, r) => n + r.s.lives, 0);
  // Shelf life: how much of the current pulse window is left (or how long it's been gone).
  // Trend: ▲ healthy, ▼ fading (under a quarter of the window left), dead, or in a takeover vote.
  const row = ({ c, s }) => {
    if (!s) return `<div class="coinrow" style="--c:var(--dim)"><span class="dot"></span><span>${esc(c.account_id)}</span><span class="chip hide-sm">unreachable</span><span>—</span><span>—</span></div>`;
    const iv = s.config.pulse_interval_secs, left = s.flatline_at - s.now, frac = Math.max(0, Math.min(1, left / iv));
    const shelf = s.status === "alive" ? `${fmtDur(left)} left`
      : s.status === "voting" ? `vote ends in ${fmtDur(s.takeover.ends_at - s.now)}`
      : s.status === "vote_closed" ? "vote closed" : `expired ${fmtDur(s.now - s.flatline_at)} ago`;
    const [tri, word, col] = s.status === "alive" ? (frac >= 0.25 ? ["▲", "healthy", "--alive"] : ["▼", "fading", "--vote"])
      : s.takeover ? ["▼", "in a vote", "--vote"] : ["▼", "dead", "--dead"];
    // The bar: time left in the pulse window, or in the takeover vote; empty once dead.
    const barFrac = s.status === "alive" ? frac : s.status === "voting"
      ? Math.max(0, Math.min(1, (s.takeover.ends_at - s.now) / s.config.vote_duration_secs)) : 0;
    const livesNote = s.lives ? `${s.lives} ${s.lives === 1 ? "life" : "lives"} restored` : "never revived";
    return `<a class="coinrow" href="#/coin/${encodeURIComponent(c.account_id)}" style="--c:var(${COLORS[s.status]})">
      <span class="dot ${s.status === "alive" ? "beat" : ""}"></span>
      <span><b>${esc(s.config.name)}</b><small>$${esc(s.config.symbol)}</small>${s.kind === "guard" ? `<small class="tag">connected</small>` : ""}</span>
      <span class="hide-sm"><span class="chip">${LABEL[s.status]}</span></span>
      <span class="shelf">${esc(shelf)}<span class="bar"><i style="width:${(barFrac * 100).toFixed(1)}%"></i></span></span>
      <span class="trend" style="--t:var(${col})" title="${word} · ${livesNote}"><b>${tri}</b><span class="hide-sm">${word}</span></span></a>`;
  };
  return `
    <section class="hero">
      <div>
        <div class="label">NEP-141 · Sputnik DAO · NEAR</div>
        <h1>Community takeover,<br><em>onchain.</em></h1>
      </div>
      <div class="hero-copy">
        <p>The dev keeps the coin alive by posting a heartbeat on-chain. If the heartbeat stops, the coin flatlines
          and holders can vote a DAO in to take over. If the vote passes, the dev's locked tokens are burned,
          the treasury moves to the DAO and the coin gains a life. Only tokens held before the flatline can vote.</p>
        ${DEMO ? `<p class="sim">You're in the simulator. <a href="./">See the live coins on NEAR testnet</a>.</p>` : ""}
      </div>
    </section>
    <section class="panel full">
      <div class="watchhead">
        ${ph("Flatline Watch", "Open takeovers first, then dead coins, then the coins closest to death.")}
        <div class="stats">
          <div class="stat"><div class="label">Coins</div><div class="v">${live.length}</div></div>
          <div class="stat"><div class="label">Flatlined</div><div class="v" style="color:var(--dead)">${dead}</div></div>
          <div class="stat"><div class="label">Takeovers</div><div class="v" style="color:var(--vote)">${votes}</div></div>
          <div class="stat"><div class="label">Revivals</div><div class="v" style="color:var(--alive)">${lives}</div></div>
        </div>
      </div>
      <div class="coins">${rows.length ? `<div class="coinhead"><span></span><span>Coin</span><span class="hide-sm">Pulse</span><span>Shelf life</span><span>Trend</span></div>`
        + rows.map(row).join("") : `<div class="empty">No coins yet. <a href="#/launch">Launch the first one.</a></div>`}</div>
    </section>`;
}

        <div><b>Flatline.</b> Miss the deadline and the coin flatlines. The keeper can no longer spend the treasury, claim tokens or change links.</div>
        <div><b>Takeover.</b> Any holder from before the flatline can nominate a Sputnik DAO as the new keeper. That opens a vote.</div>
        <div><b>Who votes.</b> Your vote counts by how many tokens you held and for how long, up to the moment the coin died. Tokens bought after that count for nothing, and moving them to another wallet doesn't help.</div>
        <div><b>Comeback.</b> While the vote is open, the old keeper can still come back, but pays a penalty into the treasury and the vote is cancelled.</div>
        <div><b>Revival.</b> If yes wins and reaches quorum, the DAO becomes keeper, the creator's locked tokens are burned and the coin gains a life. The DAO has to keep pulsing too.</div>
        <div><b>Lore.</b> Every birth, death, takeover and revival is recorded on-chain, so a coin's history is part of its meme.</div>
      </div>
      <div class="ph" style="margin-top:26px"><h2>Coins launched elsewhere</h2></div>

        <div><b>Lock.</b> The creator locks their tokens in the guard. They vest only while the creator keeps pulsing.</div>
        <div><b>Stake.</b> Holders stake in the guard to get a vote. Unstaking is always open, but only stake from before the flatline counts.</div>

      `${guard ? "Guard" : "Coin"} code hash <b>${esc(v.code_hash)}</b><br>Factory code hash <b>${esc(v.factory_code_hash || "—")}</b><br>SHA-256 hex ${esc(b58ToHex(v.code_hash))} — compare with the hash printed by <a href="${REPO}/actions" target="_blank" rel="noopener">CI</a>.`)}
    ${item(v.factory_keys === 0 ? true : v.factory_keys === null ? null : false, v.factory_keys === 0 ? "The factory is locked" : "The factory still has keys",
      `${esc(v.factory)} ${v.factory_keys === 0 ? "has no keys, so nobody can change how coins are made." : `has ${v.factory_keys ?? "?"} key(s).`}`)}
    ${item(solvent, solvent ? "The treasury is fully backed" : "Treasury exceeds the coin's balance",
      `Account balance ${fmtNear(v.balance)} ≥ treasury ${fmtNear(S.treasury)}.`)}
    ${guard
      ? item(supplyOk, supplyOk ? "Every staked and locked token is in the guard" : "The guard holds less than it owes",
        `${esc(S.token_id)} says the guard holds ${fmtTokens(v.held)} $${esc(S.config.symbol)} ≥ staked ${fmtTokens(S.staked)} + creator bag ${fmtTokens(S.dev_locked)} + sealed ${fmtTokens(S.dev_burned)}.`)
      : item(supplyOk, supplyOk ? "Supply adds up" : "Supply does not add up",
        `Total ${fmtTokens(v.supply)} = held by holders ${fmtTokens(S.circulating ?? 0)} + creator locked ${fmtTokens(S.dev_locked)} (burned so far: ${fmtTokens(S.dev_burned)}).`)}
    ${guard ? item(true, "The token itself is untouched", `${esc(v.meta.name || S.config.name)} ($${esc(v.meta.symbol || S.config.symbol)}, ${fmtTokens(v.supply)} supply) is its own NEP-141 contract.
        Revive can't mint, freeze or move it; the guard only holds what holders and the creator send it.`) : ""}
    ${keeperDao && isSputnik(S.keeper)
      ? item(true, "The keeper is a Sputnik DAO", `${esc(S.keeper)} — holders revived this coin ${S.lives} time(s).`)
      : keeperDao
      ? item(null, "The keeper is the steward holders voted in", `${esc(S.keeper)} — holders revived this coin ${S.lives} time(s). This demo coin uses a stand-in steward account, not a Sputnik DAO (its suffix is ${esc(S.config.dao_suffix)}).`)
      : item(null, "The keeper is the creator", `If ${esc(S.keeper)} stops pulsing, holders can vote a DAO in.`)}
  </section>`;
}

function directorPanel(id) {
  if (!DEMO) return "";
  return `<section class="panel full director">
    ${ph("Simulator", `A simulated contract with the same rules.${id === MOCKS[0].id ? " Click the steps in order to play the story." : " The step-by-step story is on Nine Lives."}`)}
    <p class="hint">You are acting as <select id="actor" style="width:auto;display:inline-block">${["alice.testnet", "bob.testnet", "carol.testnet", "whale.testnet", "dev.testnet", REG.coin(id).keeper]
      .filter((v, i, a) => a.indexOf(v) === i).map((a) => `<option ${a === ACTOR.value ? "selected" : ""}>${a}</option>`).join("")}</select>. Switch accounts to act as anyone.</p>
    ${id === MOCKS[0].id ? `<div class="steps">${STORY.map(([l], i) => `<button data-i="${i}">${l}</button>`).join("")}</div>` : ""}
    <div class="actions"><button data-skip="21600">⏩ +6 hours</button><button data-skip="86400">⏩ +1 day</button>
      ${REG.coin(id) instanceof GuardMock ? `<button data-buy="1">Whale buys 250M $${esc(REG.coin(id).cfg.symbol)}</button>` : ""}</div>
  </section>`;
}
const NINE = () => MOCKS[0];
const as = (a) => { ACTOR.value = a; };
const STORY = [
  ["1 · Dev pulses", () => { as("dev.testnet"); CLOCK.t += DAY; NINE().pulse("dev.testnet"); return "Dev pulsed. The coin is alive."; }],
  ["2 · Dev goes silent (+3 days)", () => { CLOCK.t += 3 * DAY + 60; return "No pulse. FLATLINE."; }],
  ["3 · Whale buys 250M after death", () => { NINE().buy("whale.testnet", 250_000_000); return "Whale bought 250M — after the flatline."; }],
  ["4 · Alice opens takeover", () => { as("alice.testnet"); NINE().startTakeover("alice.testnet", "ninelives.sputnikv2.testnet"); return "Takeover opened: ninelives DAO nominated."; }],
  ["5 · Alice votes yes", () => { as("alice.testnet"); NINE().vote("alice.testnet", true); return "Alice: YES."; }],
  ["6 · Whale tries to vote no", () => { as("whale.testnet"); NINE().vote("whale.testnet", false); }],
  ["7 · Bob votes yes", () => { as("bob.testnet"); NINE().vote("bob.testnet", true); return "Bob: YES."; }],
  ["8 · Carol votes no", () => { as("carol.testnet"); NINE().vote("carol.testnet", false); return "Carol: NO."; }],
  ["9 · Vote ends (+1 day)", () => { CLOCK.t += DAY; return "Vote closed."; }],
  ["10 · Finalize → REVIVE", () => { as("bob.testnet"); const ok = NINE().finalize(); if (ok) revivedFx(); return ok ? "REVIVED. Life #" + NINE().lives + ". Dev tokens burned." : "Takeover failed."; }],
  ["11 · DAO pulses as keeper", () => { as("ninelives.sputnikv2.testnet"); CLOCK.t += DAY; NINE().pulse("ninelives.sputnikv2.testnet"); return "The DAO keeps the heart beating."; }],
  ["Alt · Dev comes back mid-vote", () => { as("dev.testnet"); NINE().pulse("dev.testnet", 2n * YOCTO_NEAR); return "Comeback: 2 Ⓝ penalty to the treasury, vote cancelled."; }],
  ["↺ Reset", () => { NINE().reset(); as("alice.testnet"); return "Reset."; }],
];

// ================================================================ actions
function bind(r) {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  if (r.page === "coin") {
    const src = REG.coin(r.id), S = window.__S;
    const act = async (method, args, deposit, ok) => {
      try { await src.call(method, args, deposit); toast(ok); }
      catch (e) { toast(String(e.message || e).replace(/^.*Smart contract panicked: /, ""), true); }
      await render();
    };
    on("b-pulse", () => { const late = $("b-pulse").dataset.late; act("pulse", {}, late ? S.config.comeback_penalty : "0", late ? "Back from the dead. Penalty paid to the treasury." : "Pulse sent. Still alive."); });
    on("b-start", () => act("start_takeover", { steward: $("steward").value.trim() }, "0", "Takeover opened. Holders, vote."));
    on("b-yes", () => act("vote", { support: true }, "0", "Voted YES."));
    on("b-no", () => act("vote", { support: false }, "0", "Voted NO."));
    on("b-final", () => act("finalize_takeover", {}, "0", "Vote finalized."));
    const amt = (id) => { const v = $(id).value; return parseUnits(v); };
    const tokenAct = async (fn, ok) => {
      try { await fn(); toast(ok); } catch (e) { toast(String(e.message || e).replace(/^.*Smart contract panicked: /, ""), true); }
      await render();
    };
    on("b-stake", () => tokenAct(() => src.send(amt("stake-amt"), "stake"), "Staked. It starts counting now."));
    on("b-unstake", () => tokenAct(() => src.call("unstake", { amount: amt("stake-amt") }, "0", TGAS100), "Unstaked back to your wallet."));
    on("b-lock", () => tokenAct(() => src.send(amt("lock-amt"), "lock"), "Tokens locked in the guard."));
    on("b-max", () => { const b = $("b-max"); $("stake-amt").value = formatUnits(BigInt(b.dataset.w) > 0n ? b.dataset.w : b.dataset.s); });
    document.querySelectorAll("[data-skip]").forEach((b) => b.onclick = () => { CLOCK.t += Number(b.dataset.skip); render(); });
    document.querySelectorAll("[data-buy]").forEach((b) => b.onclick = () => {
      try { src.buy("whale.testnet", 250_000_000); ACTOR.value = "whale.testnet"; toast("Whale bought 250M. Now acting as whale."); } catch (e) { toast(e.message, true); }
      render();
    });
    bindChart();
    const actor = $("actor"); if (actor) actor.onchange = () => { ACTOR.value = actor.value; render(); };
    const steps = document.querySelector(".steps");
    if (steps) steps.onclick = async (e) => {
      const b = e.target.closest("button"); if (!b) return;
      try { const msg = STORY[b.dataset.i][1](); if (msg) toast(msg); } catch (err) { toast("Rejected: " + err.message, true); }
      await render();
    };
    if ($("ecg")) startEcg();
  }
  if (r.page === "connect") {
    on("b-check", async () => {
      CONNECT.token = $("c-token").value.trim(); CONNECT.info = null; CONNECT.err = "";
      try { CONNECT.info = await REG.token(CONNECT.token); if (!CONNECT.info.meta?.symbol) throw new Error("that account doesn't answer ft_metadata like a NEP-141 token"); }
      catch (e) { CONNECT.info = null; CONNECT.err = /does not exist|doesn't exist|UNKNOWN_ACCOUNT/i.test(e.message) ? `${CONNECT.token} doesn't exist on ${NETWORK}` : /MethodNotFound|CodeDoesNotExist|no contract/i.test(e.message) ? `${CONNECT.token} isn't a NEP-141 token` : e.message; }
      render();
    });
    const form = $("connectf");
    if (form) {
      const cost = () => { try { const { deposit } = readConnect(form); $("ccost").textContent = `You'll attach ${fmtNear(deposit)} (${fmtNear(CONNECT_COST)} for the guard + treasury seed).`; } catch {} };
      form.oninput = cost; cost();
      form.onsubmit = async (e) => {
        e.preventDefault();
        const { name, config, deposit } = readConnect(form);
        try {
          const id = await REG.connect(name, config, deposit);
          toast(`$${CONNECT.info.meta.symbol} connected. Lock your tokens next.`);
          CONNECT.token = ""; CONNECT.info = null;
          location.hash = `#/coin/${encodeURIComponent(typeof id === "string" ? id : `${name}.${CONNECT_FACTORY}`)}`;
        } catch (err) { toast(String(err.message || err), true); }
      };
    }
  }
  if (r.page === "launch") {
    const form = $("launch");
    const cost = () => { try { const { deposit } = readLaunch(form); $("cost").textContent = `You'll attach ${fmtNear(deposit)} (${fmtNear(LAUNCH_COST)} storage + treasury seed).`; } catch {} };
    form.oninput = cost; cost();
    form.onsubmit = async (e) => {
      e.preventDefault();
      const { name, config, deposit } = readLaunch(form);
      try {
        const id = await REG.launch(name, config, deposit);
        toast(`${config.symbol} launched.`);
        location.hash = `#/coin/${encodeURIComponent(typeof id === "string" ? id : `${name}.${FACTORY_ID}`)}`;
      } catch (err) { toast(String(err.message || err), true); }
    };
  }
}

function revivedFx() { const f = $("flash"); if (f) { f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); } ecg.kick = 1; }

// ==================================================================== ECG
const ecg = { x: 0, kick: 0, last: [], running: false };
function startEcg() { if (!ecg.running) { ecg.running = true; requestAnimationFrame(drawEcg); } }
function drawEcg() {
  const c = $("ecg");
  if (!c) { ecg.running = false; return; }
  const dpr = devicePixelRatio || 1;
  // A refresh swaps in a new canvas: size it, but keep the trace unless the width really changed.
  if (c.width !== c.clientWidth * dpr || c.height !== c.clientHeight * dpr) { c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr; }
  if (ecg.W !== c.width) { ecg.W = c.width; ecg.last = []; ecg.x = 0; }
  const g = c.getContext("2d"), W = c.width, H = c.height, mid = H * 0.6;
  const status = window.__S ? window.__S.status : "alive";
  const color = getComputedStyle(document.documentElement).getPropertyValue(COLORS[status] || "--alive").trim();
  for (let i = 0; i < 2; i++) {
    ecg.x = (ecg.x + 2.2 * dpr) % W;
    const p = (performance.now() / 900) % 1;
    let y = mid + (Math.random() - 0.5) * 1.5 * dpr;
    if (ecg.kick > 0) { y = mid - Math.sin(ecg.kick * Math.PI) * H * 0.55; ecg.kick = Math.max(0, ecg.kick - 0.02); }
    else if (status === "alive") {
      if (p > .10 && p < .14) y -= H * .06 * Math.sin((p - .10) / .04 * Math.PI);
      if (p > .20 && p < .22) y += H * .08;
      if (p > .22 && p < .25) y -= H * .45 * Math.sin((p - .22) / .03 * Math.PI);
      if (p > .25 && p < .27) y += H * .12;
      if (p > .40 && p < .48) y -= H * .09 * Math.sin((p - .40) / .08 * Math.PI);
    } else if (status === "voting") {
      if (p > .5 && p < .53) y -= H * .05 * Math.sin((p - .5) / .03 * Math.PI);
    }
    ecg.last[Math.floor(ecg.x / dpr)] = y;
  }
  g.clearRect(0, 0, W, H);
  g.strokeStyle = "rgba(15,23,42,.06)"; g.lineWidth = 1;
  for (let gx = 0; gx < W; gx += 24 * dpr) { g.beginPath(); g.moveTo(gx, 0); g.lineTo(gx, H); g.stroke(); }
  for (let gy = 0; gy < H; gy += 24 * dpr) { g.beginPath(); g.moveTo(0, gy); g.lineTo(W, gy); g.stroke(); }
  g.strokeStyle = color; g.lineWidth = 2 * dpr;
  g.beginPath();
  const head = Math.floor(ecg.x / dpr), cols = Math.floor(W / dpr);
  for (let i = 0; i < cols; i++) {
    if (i > head && i - head < 14) continue;
    const y = ecg.last[i] ?? mid;
    if (i === 0 || i === head + 14) g.moveTo(i * dpr, y); else g.lineTo(i * dpr, y);
  }
  g.stroke(); g.shadowBlur = 0;
  g.fillStyle = color; g.beginPath(); g.arc(ecg.x, ecg.last[head] ?? mid, 3.5 * dpr, 0, 7); g.fill();
  requestAnimationFrame(drawEcg);
}

// =================================================================== boot
window.addEventListener("hashchange", render);
if (!DEMO) {
  setupWallet().then(render).catch(() => {});
  $("connect").onclick = async () => {
    if (!connector) return;
    if (account) { const w = await connector.wallet(); await w.signOut(); account = null; render(); }
    else connector.connect();
  };
  setInterval(() => { if (!document.activeElement || !["INPUT", "SELECT"].includes(document.activeElement.tagName)) render(); }, 8000);
}
render();
</script>
