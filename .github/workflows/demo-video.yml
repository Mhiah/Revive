name: demo-video
on:
  push:
    branches: [demo-video]
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-dejavu-core >/dev/null
      - run: |
          python -m http.server 8080 >/dev/null 2>&1 &
          sleep 1
          python video/film.py
      - uses: actions/upload-artifact@v4
        with: { name: scenes, path: out/ }
