name: demo-video
on:
  push:
    branches: [demo-video]
permissions:
  contents: write
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-dejavu-core >/dev/null
      - run: |
          python -m http.server 8080 >/dev/null 2>&1 &
          sleep 1
          python video/film.py
      - name: Save the clips to the demo-video-out branch
        run: |
          mkdir /tmp/pub && cp -r out/* /tmp/pub/ && cd /tmp/pub
          git init -q && git checkout -q -b demo-video-out
          git -c user.name=Mhiah -c user.email=192190660+Mhiah@users.noreply.github.com add -A
          git -c user.name=Mhiah -c user.email=192190660+Mhiah@users.noreply.github.com commit -q -m "Demo video clips"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" demo-video-out
