name: contract

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Unit tests and lints
        run: |
          for c in contract factory guard samples/plain-token; do
            (cd $c && cargo test && cargo clippy --all-targets -- -D warnings)
          done

      - name: 60-day simulation runs on the real contract
        run: cd contract && cargo run --example simulate /tmp/simulation.json

      - name: Cache cargo-near
        id: cache-cargo-near
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-near
          key: cargo-near-${{ runner.os }}-v1

      - name: Install cargo-near
        if: steps.cache-cargo-near.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          if ! curl --proto '=https' --tlsv1.2 -LsSf --retry 5 --retry-all-errors \
              https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh; then
            echo "Installer download failed; building cargo-near from source"
            sudo apt-get update -q && sudo apt-get install -yq libudev-dev pkg-config
            cargo install cargo-near --locked
          fi

      - name: Build wasm
        run: |
          cargo near --version
          (cd contract && cargo near build non-reproducible-wasm --no-abi)
          (cd factory && cargo near build non-reproducible-wasm --no-abi)
          (cd guard && cargo near build non-reproducible-wasm --no-abi)
          (cd samples/plain-token && cargo near build non-reproducible-wasm --no-abi)

      - name: Shrink wasm (smaller code = cheaper storage)
        run: |
          sudo apt-get install -yq binaryen >/dev/null
          for w in contract/target/near/revive.wasm factory/target/near/revive_factory.wasm guard/target/near/revive_guard.wasm samples/plain-token/target/near/plain_token.wasm; do
            before=$(stat -c%s $w)
            # Only a size optimisation: if this wasm-opt can't read the compiler's output, keep the original.
            if wasm-opt -Oz --strip-debug --strip-producers $w -o $w.opt 2>/dev/null; then mv $w.opt $w; else echo "wasm-opt skipped for $w"; fi
            echo "$w: $before -> $(stat -c%s $w) bytes"
          done

      - name: SHA-256 of the wasm (compare with the deployed code hash)
        run: |
          sha256sum contract/target/near/revive.wasm factory/target/near/revive_factory.wasm guard/target/near/revive_guard.wasm samples/plain-token/target/near/plain_token.wasm
          ls -l contract/target/near/revive.wasm factory/target/near/revive_factory.wasm guard/target/near/revive_guard.wasm samples/plain-token/target/near/plain_token.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: revive-wasm
          path: |
            contract/target/near/revive.wasm
            factory/target/near/revive_factory.wasm
            guard/target/near/revive_guard.wasm
            samples/plain-token/target/near/plain_token.wasm

  sandbox-e2e:
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: revive-wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all four stories on a local NEAR sandbox
        run: |
          cd scripts && npm install --no-audit --no-fund && cd ..
          node scripts/sandbox-e2e.mjs
