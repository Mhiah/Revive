name: testnet-demo

# Run by hand (Actions → testnet-demo → Run workflow). Needs two repository
# secrets for a funded testnet account (the run prints what it needs:
# about 11 NEAR for both coin stories, about 7 for the connect story alone):
#   NEAR_ACCOUNT_ID   e.g. revive-demo.testnet
#   NEAR_PRIVATE_KEY  ed25519:...
# Deploys the factory, plays the chosen stories live, and
# uploads demo-coins.json with the account names (no keys).
on:
  workflow_dispatch:
    inputs:
      steward:
        description: "Existing Sputnik DAO to nominate (optional, e.g. ninelives.sputnikv2.testnet)"
        required: false
      timer:
        description: "Pulse interval and vote length in seconds (min 60)"
        default: "60"
      stories:
        description: "coins = $NINE and $BACK, nine = $NINE only, guard = connect an outside $MEME token, dao = a real Sputnik DAO takes over $CIVIC, alive = $HERE with a 3-day heartbeat, site = only deploy and lock a factory for the app"
        default: "guard"
      factory:
        description: "Reuse an existing locked factory (optional), e.g. revive-bhtat.revive.testnet"
        required: false
      reuse_dao:
        description: "Keep $CIVIC with this existing Sputnik DAO instead of creating one (optional), with council_tag"
        required: false
      council_tag:
        description: "Tag of the run whose alice and bob sit on that DAO's council (optional), e.g. vft8z"
        required: false
      sweep:
        description: "Tags of earlier runs whose demo accounts return their spare NEAR first (optional), e.g. 6tx39,ztw7t"
        required: false
      holder_near:
        description: "NEAR given to each demo holder (default 0.15)"
        required: false
      resume:
        description: "Tag of a stopped run to continue (optional), e.g. cia7y"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo-near
        id: cache-cargo-near
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-near
          key: cargo-near-${{ runner.os }}-v1
      - name: Install cargo-near
        if: steps.cache-cargo-near.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          if ! curl --proto '=https' --tlsv1.2 -LsSf --retry 5 --retry-all-errors \
              https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh; then
            sudo apt-get update -q && sudo apt-get install -yq libudev-dev pkg-config
            cargo install cargo-near --locked
          fi
      - name: Build wasm
        run: |
          (cd contract && cargo near build non-reproducible-wasm --no-abi)
          (cd factory && cargo near build non-reproducible-wasm --no-abi)
          (cd guard && cargo near build non-reproducible-wasm --no-abi)
          (cd samples/plain-token && cargo near build non-reproducible-wasm --no-abi)
      - name: Shrink wasm (smaller code = cheaper storage)
        run: |
          sudo apt-get install -yq binaryen >/dev/null
          for w in contract/target/near/revive.wasm factory/target/near/revive_factory.wasm guard/target/near/revive_guard.wasm samples/plain-token/target/near/plain_token.wasm; do
            before=$(stat -c%s $w)
            # Only a size optimisation: if this wasm-opt can't read the compiler's output, keep the original.
            if wasm-opt -Oz --strip-debug --strip-producers $w -o $w.opt 2>/dev/null; then mv $w.opt $w; else echo "wasm-opt skipped for $w"; fi
            echo "$w: $before -> $(stat -c%s $w) bytes"
          done
          sha256sum contract/target/near/revive.wasm factory/target/near/revive_factory.wasm guard/target/near/revive_guard.wasm samples/plain-token/target/near/plain_token.wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy and play the stories on testnet
        env:
          NEAR_ACCOUNT_ID: ${{ secrets.NEAR_ACCOUNT_ID }}
          NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
          STEWARD: ${{ inputs.steward }}
          DAO_SUFFIX: ${{ inputs.steward && '.sputnikv2.testnet' || '' }}
          TIMER: ${{ inputs.timer }}
          STORIES: ${{ inputs.stories }}
          FACTORY: ${{ inputs.factory }}
          RESUME_TAG: ${{ inputs.resume }}
          REUSE_DAO: ${{ inputs.reuse_dao }}
          COUNCIL_TAG: ${{ inputs.council_tag }}
          SWEEP_TAGS: ${{ inputs.sweep }}
          HOLDER_NEAR: ${{ inputs.holder_near || '0.15' }}
          SPUTNIK_FACTORY: sputnikv2.testnet
        run: |
          cd scripts && npm install --no-audit --no-fund && cd ..
          node scripts/demo-coins.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-coins
          path: demo-coins.json
          if-no-files-found: ignore
