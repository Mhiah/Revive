[package]
name = "revive"
version = "0.1.0"
edition = "2021"
description = "Revive: a NEAR memecoin with a community takeover built into the contract"
license = "MIT"
repository = "https://github.com/Mhiah/Revive"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
